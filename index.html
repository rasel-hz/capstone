<style>

<div class="in"><div id="lm" style="cursor:pointer" onclick="lmood()">${mas('happy',190)}</div><h1>كل يوم له جوّه.. وخويّك يعرف كيف يمشي معك 🤍</h1><p>خويّك رفيقك الذكي، يسولف معك، يفهم يومك، ويجهز لك تحديات ممتعة تناسبك وتساعدك تتقدم على راحتك.</p><button class="btn cor" onclick="S.started=1;save();render()">يلا نبدأ رحلتنا</button> <button class="btn alt" onclick="document.getElementById('meet').scrollIntoView({behavior:'smooth'})">اكتشف خويّك</button><p class="note">جرّب تضغط على خويّك 👆</p></div></div>
<section id="meet" class="rv"><h1>تعرّف على خويّك</h1><p>رفيق صغير يتغير شكله حسب اللحظة: يسمعك، يفكر معك، ويفرح لما تنجز. هو مو معالج نفسي ولا بديل عن أهلك وأصحابك أو المختصين.</p><div class="grid">${[['listen','يسمعك'],['think','يفكر معك'],['enc','يشجعك'],['celebrate','يحتفل معك'],['calm','يهدّيك'],['concern','يهتم لو تعبت']].map(m=>`<div class="card" style="text-align:center">${mas(m[0],90)}<h3>${m[1]}</h3></div>`).join('')}</div></section>
<section class="rv"><h1>كيف يشتغل؟</h1><div class="steps">${['يتعرف عليك','يفهم يومك وظروفك','يجهز لك تحديات تناسبك','تلعب وتتفاعل','يتعلم من نتائجك','تحتفل بتقدمك'].map((s,i)=>`<div class="card"><div style="font-size:30px;font-weight:700;color:var(--lav)">${i+1}</div><h3>${s}</h3></div>`).join('')}</div></section>
<section class="rv"><h1>رحلاتك</h1><div class="grid">${JN.map(j=>`<div class="card jc">${sc(j.id)}<div class="b"><h3>${j.n}</h3><p class="note" style="color:#44594f">${j.d}</p></div></div>`).join('')}</div></section>
<section class="rv"><h1>جرّب تحدي الحين</h1><div class="card" id="lpg"><div class="cb"><div id="sm">${mas('curious',80)}</div><div class="bub" id="sb">جرّب تحدي صغير بدون تسجيل.</div></div><div id="st"><button class="btn" onclick="lpPlay()">يلا نلعب</button></div></div></section>
<section class="rv"><h1>على قد يومك السعودي</h1><div class="grid">${[['🕌','حماية وقت الصلاة','تدخل وقت الصلاة وتختار مدة الحماية'],['🚗','قيادة بأمان','ما تظهر لك تحديات وأنت تسوق'],['👨‍👩‍👧','عزائم وجمعة الأهل','خطة أخف قبل المناسبات'],['🌙','رمضان والعيد','تعدّل روتينك بنفسك'],['🎓','دوام ودراسة','تنظيم حسب جدولك'],['⛅','الطقس','غير مربوط حاليًا']].map(c=>`<div class="card"><div style="font-size:30px">${c[0]}</div><h3>${c[1]}</h3><p class="note">${c[2]}</p></div>`).join('')}</div></section>
<section class="rv"><h1>تقدمك ومكافآتك</h1><div class="card"><b>المستوى 3</b><div class="bar"><i style="width:65%"></i></div><p class="note">مثال توضيحي. بياناتك الحقيقية تظهر بعد ما تلعب.</p></div></section>
<section class="rv" style="text-align:center"><div style="background:linear-gradient(135deg,var(--lil),var(--pe),var(--sage));border-radius:36px;padding:40px 16px">${mas('celebrate',150)}<h1>جاهز تبدأ؟ خويّك بانتظارك!</h1><button class="btn" onclick="S.started=1;save();render()">يلا نبدأ</button></div></section></div>`;
const io=new IntersectionObserver(e=>e.forEach(x=>x.isIntersecting&&x.target.classList.add('v')),{threshold:.15});document.querySelectorAll('.rv').forEach(x=>io.observe(x));
$('#lh').onmousemove=e=>{const r=e.currentTarget.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;document.querySelectorAll('.fl').forEach(f=>f.style.transform=`translate(${x*f.dataset.p}px,${y*f.dataset.p}px)`)}}
function lmood(){const a=['curious','happy','celebrate','listen','think'];lmi=(lmi+1)%a.length;$('#lm').innerHTML=mas(a[lmi],190);sfx('tap')}
function lpPlay(){G={};memGame($('#st'),{diff:'easy'},r=>{$('#st').innerHTML=`<p>نتيجتك ${r.acc}%. هذا غيض من فيض.</p><button class="btn" onclick="S.started=1;save();render()">يلا نبدأ رحلتنا</button>`;say('celebrate','يا سلام عليك! تبي نكمل؟')})}
// ===== onboarding
let ob=0,tm={name:S.name,g:'m',needs:[],sched:'work',pat:'',sleep:'',pp:30,prayer:'',snd:1,rm:0};
function onboard(){const sel=(k,v)=>`onclick="tm.${k}=${typeof v=='string'?`'${v}'`:v};onboard()"`,c=(k,v,l)=>`<button class="chip ${tm[k]===v?'on':''}" ${sel(k,v)}>${l}</button>`;
const st=[`${mas('happy',150)}<h1>هلا والله! أنا خويّك</h1><p>وبنبدأ رحلتنا سوا. وش أسمّيك؟</p><input id="nm" value="${tm.name}" placeholder="اسمك أو لقبك" style="max-width:300px;text-align:center"><p>أخاطبك كـ</p>${c('g','m','ذكر')}${c('g','f','أنثى')}<p class="note">ما نطلب تشخيص ولا معلومات طبية. بياناتك محفوظة على جهازك فقط وتقدر تمسحها بأي وقت.</p>`,
`${mas('listen',130)}<h2>وش تحب نشتغل عليه؟</h2><p class="note">اختياري، وتقدر تغيّره بعدين.</p>${JN.map(j=>`<button class="chip ${tm.needs.includes(j.id)?'on':''}" onclick="tn('${j.id}')">${j.n}</button>`).join('')}`,
`${mas('curious',130)}<h2>كيف يومك غالبًا؟</h2>${c('sched','work','دوام')}${c('sched','study','دراسة')}${c('sched','flex','مرن')}<p>وقت نشاطك</p>${c('pat','am','صباحي')}${c('pat','pm','مسائي')}<p>نومك (اختياري)</p>${c('sleep','early','أنام بدري')}${c('sleep','late','أنام متأخر')}${c('sleep','skip','أفضّل أتخطى')}`,
`${mas('calm',130)}<h2>الصلاة</h2><p>كم دقيقة نحمي بعد الأذان؟</p>${[0,20,30,45].map(v=>c('pp',v,v?v+' دقيقة':'ما أبي')).join('')}<p class="note">ما فيه ربط مباشر بمواقيت الصلاة. تقدر تدخل وقت الصلاة القادمة من ملفّك أو من الرئيسية.</p>`,
`${mas('enc',130)}<h2>راحتك</h2><p>الأصوات</p>${c('snd',1,'شغّلها')}${c('snd',0,'بدون صوت')}<p>الحركة</p>${c('rm',0,'عادية')}${c('rm',1,'أقل حركة')}<p class="note">الإشعارات غير مفعّلة في هذا العرض.</p>`];
$('#app').innerHTML=`<main style="text-align:center;max-width:620px;padding-top:6vh"><div class="dots" style="justify-content:center;margin-bottom:12px">${st.map((_,i)=>`<i class="${i<=ob?'on':''}"></i>`).join('')}</div><div class="card">${st[ob]}<br><br>${ob>0?'<button class="btn alt" onclick="ob--;onboard()">رجوع</button> ':''}<button class="btn" onclick="onext()">${ob==4?'خلصنا':'التالي'}</button></div></main>`}
function tn(i){const a=tm.needs;a.includes(i)?a.splice(a.indexOf(i),1):a.push(i);onboard()}
function onext(){const n=$('#nm');if(ob==0)tm.name=(n.value.trim()||T('يا بطل','يا بطلة'));if(ob==0)tm.name=n.value.trim()||'يا بطل';if(ob<4){ob++;return onboard()}Object.assign(S,tm,{needs:tm.needs.length?tm.needs:['gen'],done:1,view:'home'});S.chat=[{b:1,t:`هلا والله يا ${S.name}! وش علومك اليوم؟ احكيلي عن يومك: نومك، دوامك، أو أي عزيمة عندك، وأرتّب لك مهمة اليوم على قدّك.`}];save();render()}
// ===== context helpers
const low=()=>{const e=S.en.slice(-1)[0];return(e&&e.d==D0()&&e.e=='low')||S.pref=='short'};
function inPrayer(){if(!S.prayer||!S.pp)return false;const[h,m]=S.prayer.split(':').map(Number),n=new Date(),x=n.getHours()*60+n.getMinutes()-(h*60+m);return x>=-2&&x<S.pp}
function lastAcc(id){const a=S.hist.filter(h=>h.id==id&&h.acc!=null);return a.length?a[a.length-1].acc:null}
function why(id){const r=[];if(low())r.push('ذكرت إن طاقتك قليلة، فاخترت لك الأخف');if(S.pref=='short')r.push('وافقت نعتمد التحديات القصيرة');if(S.ctx.includes('event')&&id=='seq')r.push('عندك مناسبة الليلة، فنجهّزها بالترتيب');if(lastAcc(id)!=null&&lastAcc(id)<60)r.push('آخر مرة كانت نتيجتك '+lastAcc(id)+'%، فنبدأها أسهل');if(id=='video')r.push('نبدأ بتركيز قصير');return r.length?r.join('، '):'يناسب الرحلات اللي اخترتها'}
function genMission(){const ev=S.ctx.includes('event'),ids=['video',ev?'seq':'mem',low()?'calm':(S.needs.some(n=>['adhd','mood'].includes(n))?'start2':'time')];return ids.map(id=>({id,why:why(id),diff:(lastAcc(id)!=null&&lastAcc(id)<60)||low()&&id!='calm'?'easy':'normal'}))}
// ===== home
function home(){const h=new Date().getHours(),gr=h<12?'صباح الخير':h<17?'مساء النور':'مساء الخير',M=S.mission,un=M&&M.status!='DONE',gm=genMission(),dn=S.hist.some(x=>x.d==D0()&&x.mid);
return `<div class="card hero">${mas(low()?'rest':'happy',130)}<div style="flex:1"><h1>هلا والله ${S.name}! ${gr} ☀️</h1><p>${low()?'يا بعدي، اليوم نمشيها خفيف.':'وش علومك اليوم؟'}</p><div>${[['high','طاقتي عالية'],['mid','عادي'],['low','مالي خلق']].map(e=>`<button class="chip ${((S.en.slice(-1)[0]||{}).d==D0()&&S.en.slice(-1)[0].e==e[0])?'on':''}" onclick="en('${e[0]}')">${e[1]}</button>`).join('')}</div></div></div>
<div class="card"><b>المستوى ${lvl()}</b> <span class="note">· باقي ${100-S.xp%100} نقطة للتالي</span><div class="bar"><i style="width:${S.xp%100}%"></i></div></div>
${un?`<div class="card" style="border:2px solid var(--sun)"><h3>يا هلا برجعتك! آخر مرة وقفنا عند "${CH[M.items[M.idx].id].t}"</h3><p>وش رايك نكمله سوا؟</p><button class="btn sm" onclick="resume(0)">كمّل</button> <button class="btn sm alt" onclick="resume(1)">ابدأ من أول</button> <button class="btn sm alt" onclick="resume(2)">نسخة أسهل</button> <button class="btn sm alt" onclick="resume(3)">تخطّى</button></div>`:''}
<div class="card" style="background:linear-gradient(135deg,#fff,var(--lil))"><span class="chip on">مهمة اليوم</span><h2 style="margin:6px 0">${S.driving?'🚗 وقت القيادة':inPrayer()?'🕌 وقت صلاة':dn?'خلصت مهمة اليوم 🎉':'٣ تحديات متتالية، تبدأها مرة وحدة'}</h2>${gm.map((g,i)=>`<div class="it"><h3>${i+1}. ${CH[g.id].t}</h3><p class="note">${g.diff=='easy'?'نسخة أسهل · ':''}${g.why}</p></div>`).join('')}<button class="btn" onclick="startMission()">${un?'كمّل المهمة':dn?'مهمة ثانية':'ابدأ المهمة'}</button></div>
<div class="grid"><div class="card"><h3>🕌 الصلاة</h3><p class="note">${S.prayer?`الصلاة القادمة ${S.prayer}، وأحمي ${S.pp} دقيقة بعدها.`:'أدخل وقت الصلاة القادمة وأحميه لك.'} (إدخال يدوي، بدون ربط بخدمة مواقيت)</p><div class="row"><input type="time" id="pr" value="${S.prayer}"><button class="btn sm" onclick="S.prayer=$('#pr').value;save();render()">حفظ</button></div></div>
<div class="card"><h3>🚗 القيادة</h3><p class="note">المرور غير مربوط. أنت تخبرني.</p><label><input type="checkbox" style="width:auto" ${S.driving?'checked':''} onchange="S.driving=this.checked?1:0;save();render()"> أنا أسوق الحين</label><div class="row"><span class="note">ساعات قيادة اليوم</span><input type="number" min="0" max="12" style="width:80px" value="${S.drive}" onchange="S.drive=+this.value;save();render()"></div>${S.drive>=2?'<p>يا بعدي، سقت واجد اليوم. أول ما توصل بالسلامة خذ لك بريك.</p>':''}</div>
<div class="card"><h3>📅 اللي سجّلته</h3><p class="note">التقويم غير مربوط. اللي تقوله في المحادثة وتوافق عليه يظهر هنا.</p>${S.ctx.length?S.ctx.map(c=>`<span class="chip">${{event:'عزيمة / مناسبة',work:'دوام أو دراسة',sleep:'نوم متأخر'}[c]}</span>`).join(''):'<p class="note">ما سجلت شي لسا.</p>'}</div></div>`}
function en(e){const x=S.en.filter(y=>y.d!=D0());x.push({d:D0(),e,ts:Date.now()});S.en=x;save();render()}
// ===== journeys / challenges
function journeys(){return `<h1>رحلاتي</h1><p class="note">اختر أكثر من رحلة. ما نطلب تشخيص. هذي رحلات دعم وتدريب، مو علاج.</p><div class="grid">${JN.map(j=>{const on=S.needs.includes(j.id);return `<div class="card jc">${sc(j.id)}<div class="b"><h2 style="margin:0">${j.n}</h2><p class="note" style="color:#44594f">${j.d}</p><div class="map">${j.a.map((a,i)=>`<button class="node ${S.hist.some(h=>h.id==a&&h.status=='COMPLETED')?'d':''}" title="${CH[a].t}" onclick="startMission([{id:'${a}',why:'من رحلة ${j.n}',diff:'normal'}])">${i+1}</button>`).join('')}</div><button class="btn sm ${on?'':'alt'}" onclick="tj('${j.id}')">${on?'رحلة نشطة ✓':'أضفها'}</button></div></div>`}).join('')}</div>`}
function tj(i){S.needs=S.needs.includes(i)?S.needs.filter(x=>x!=i):S.needs.concat(i);if(!S.needs.length)S.needs=['gen'];save();render()}
let flt='الكل';
function chal(){const cats=['الكل',...new Set(Object.values(CH).map(c=>c.cat))];return `<h1>تحدياتي</h1><div>${cats.map(c=>`<button class="chip ${flt==c?'on':''}" onclick="flt='${c}';render()">${c}</button>`).join('')}</div><br><div class="grid">${Object.entries(CH).filter(([k,c])=>flt=='الكل'||c.cat==flt).map(([k,c])=>`<div class="card"><h2 style="margin:0">${c.t}</h2><p class="note">${c.cat} · +${c.xp} XP${lastAcc(k)!=null?' · آخر دقة '+lastAcc(k)+'%':''}</p><button class="btn" onclick="startMission([{id:'${k}',why:'اخترته بنفسك',diff:'normal'}])">العب</button></div>`).join('')}</div>`}
// ===== chat
function chat(){return `<h1>خويّك</h1><p class="note">ردود المحادثة هنا تعتمد على قواعد داخل العرض، مو نموذج لغوي مربوط. أنا مو معالج ولا أشخّص، وما أحل محل أهلك وأصحابك أو المختصين.</p><div class="card"><div class="chat" id="cl">${S.chat.map(m=>m.card?`<div class="m b">${m.t}<br><button class="btn sm" onclick="cs(1)">سجّل وخفّف الخطة</button> <button class="btn sm alt" onclick="cs(2)">سجّل بس</button> <button class="btn sm alt" onclick="cs(0)">لا</button></div>`:`<div class="m ${m.b?'b':'u'}">${m.t}</div>`).join('')}</div><div class="row"><input id="ci" placeholder="اكتب لخويّك..." onkeydown="if(event.key=='Enter')send()" style="flex:1"><button class="btn" onclick="send()">أرسل</button></div></div>`}
function cs(m){const p=S.pend;S.chat=S.chat.filter(x=>!x.card);if(p&&m){p.ctx.forEach(c=>S.ctx.includes(c)||S.ctx.push(c));if(p.low)en('low');if(m==1)S.pref='short'}S.pend=null;S.chat.push({b:1,t:m==1?'تم يا بعدي، سجلتها وخففت مهمة اليوم. شوفها في الرئيسية.':m==2?'تم، سجلتها وخطتك ما تغيّرت.':'عادي، ما سجلت شي.'});save();render()}
function send(){const v=$('#ci').value.trim();if(!v)return;S.chat.push({t:v});
if(/أنتحر|انتحر|اموت|أموت|أذي نفسي|اذي نفسي|ما ابي اعيش|ما أبي أعيش/.test(v)){S.chat.push({b:1,t:'يا بعدي، كلامك مهم عندي وأهتم فيك. أنا مو بديل عن إنسان يكون جنبك الحين. إذا في خطر عليك فاتصل بالإسعاف 997 أو توجّه لأقرب طوارئ، أو كلّم الصحة على 937. وإذا تقدر كلّم أحد من أهلك أو أصحابك الحين وخلّه يجلس معك.'});save();render();return}
const c=[],l=[];let lw=0;if(/مالي خلق|تعبان|مرهق|منهك|تعبانة/.test(v)){lw=1;l.push('طاقتك قليلة')}if(/متأخر|سهران|ما نمت|سهرت/.test(v)){c.push('sleep');l.push('نمت متأخر')}if(/دوام|شغل|محاضر|جامعة/.test(v)){c.push('work');l.push('عندك دوام أو دراسة')}if(/عزيمة|عرس|زواج|جمعة|مناسبة/.test(v)){c.push('event');l.push('عندك مناسبة')}
if(l.length){S.pend={ctx:c,low:lw};S.chat.push({b:1,t:`يا بعدي، شكل يومك مليان. اللي فهمته من كلامك: ${l.join('، ')}. أسجّلها عشان أرتب لك مهمة اليوم؟ وهذا من كلامك أنت، ما أخمّن شي فوقه.`});S.chat.push({b:1,card:1,t:'تبي أخفف مهمة اليوم؟'})}
else if(/نتيج|تقدم|أدائي|إنجاز|كيف سويت/.test(v)){const H=S.hist.filter(h=>h.mid);if(!H.length)S.chat.push({b:1,t:'ما عندي سجل لسا. أول ما تخلص مهمة أقدر أحكي لك عن نتائجك الفعلية.'});else{const d=H.filter(h=>h.status=='COMPLETED').length,a=H.filter(h=>h.acc!=null);S.chat.push({b:1,t:`في سجلك ${H.length} محاولات، أكملت منها ${d}${a.length?`، ومتوسط الدقة ${Math.round(a.reduce((s,h)=>s+h.acc,0)/a.length)}%`:''}. هذا بس للمتابعة الشخصية، وما يقيس حالتك الصحية.`})}}
else if(/وش علومك|كيف حالك|هلا/.test(v))S.chat.push({b:1,t:'هلا والله! طيب الحمدلله. وأنت؟ كيف نومك ويومك؟'});
else if(/شكرا|مشكور|يعطيك/.test(v))S.chat.push({b:1,t:'الله يعافيك! أنا هنا لو احتجت، ولا تنسى جلستك مع أهلك وناسك.'});
else S.chat.push({b:1,t:'سمعتك. تبي تحكي لي أكثر عن يومك؟ ولو تبي نجرب شي خفيف، ابدأ مهمة اليوم من الرئيسية.'});
save();render()}
// ===== mission engine
let G={};
function say(m,t){const a=$('#sm'),b=$('#sb');if(a)a.innerHTML=mas(m,86);if(b&&t!=null)b.textContent=t}
function guard(){if(S.driving){ov(`${mas('concern',90)}<h2>🚗 ما نلعب وأنت تسوق</h2><p>أول ما توصل بالسلامة ألغِ خيار القيادة من الرئيسية ونكمل.</p><button class="btn" onclick="ov('')">تمام</button>`);return 1}if(inPrayer()){ov(`${mas('calm',90)}<h2>🕌 وقت صلاة</h2><p>حسب إعداداتك نأجل التحديات الحين. تقبل الله طاعتك.</p><button class="btn" onclick="ov('')">تمام</button>`);return 1}return 0}

ov('');$('#ov').innerHTML=`<div class="mp"><div class="mpw" style="text-align:center;padding-top:4vh">${mas('celebrate',170)}<h1>${T('ياخي أنت كفو!','ياخي أنتِ كفو!')}</h1><p style="font-size:30px;margin:0;color:var(--em)">+${xp} XP</p><div class="card" style="margin-top:14px;text-align:start"><h3>اللي صار فعلاً</h3><p>${a.join('، ')}.</p><h3>اقتراح بكرة</h3><p>${sug}</p>${S.prayer?'<p class="note">وإذا قرب وقت الصلاة نرتب يومنا حولها.</p>':''}${S.hist.length<4?'':''}<p class="note">هذي نتائج ألعاب للمتابعة الشخصية، ما تدل على تحسن علاجي.</p></div><button class="btn" onclick="ov('');go('chat')">سولف مع خويّك</button> <button class="btn alt" onclick="ov('');go('prog')">تطوري</button> <button class="btn alt" onclick="ov('');go('home')">الرئيسية</button></div></div>`}

function clip(el,done){const D=24,ev=[{k:'b',t:3,c:0},{k:'b',t:8,c:1},{k:'b',t:13,c:2},{k:'r',t:6},{k:'r',t:17}],cap=[[0,'نهار هادي في الواحة'],[3,'بالون يطلع للسما'],[6,'طير يعبر'],[8,'بالون ثاني'],[13,'بالون ثالث'],[17,'طير ثاني يعبر'],[21,'نهاية المقطع']];let t=0,pl=1,cc=0,lt=performance.now(),raf;

function f(n){const dt=(n-lt)/1000;lt=n;if(pl)t+=Math.min(dt,.1);ev.forEach((e,i)=>{const p=(t-e.t)/5,x=$('#e'+i);if(!x)return;if(p<0||p>1){x.style.opacity=0;return}x.style.opacity=1;if(e.k=='b'){x.style.insetInlineStart=(18+e.c*24)+'%';x.style.top=(100-p*125)+'%'}else{x.style.top='16%';x.style.insetInlineStart=(-10+p*115)+'%'}});const c=cap.filter(x=>x[0]<=t).pop();if($('#cp'))$('#cp').textContent=c?c[1]:'';if($('#vp'))$('#vp').style.width=Math.min(100,t/D*100)+'%';if(t>=D){G.stop();done();return}raf=requestAnimationFrame(f)}

function vidGame(el,it,cb){const easy=it.diff=='easy',Q=[{q:'كم بالون طلع للسما؟',o:['2','3','4'],a:'3',h:'عدّ البالونات الملونة اللي طلعت.'},{q:'وش لون آخر بالون؟',o:['مرجاني','أصفر','سماوي'],a:'سماوي',h:'آخر بالون كان بلون السما.'},{q:'كم مرة عبر الطير؟',o:['1','2','3'],a:'2',h:'عبر طير في بداية المقطع، وطير ثاني بعده.'}].slice(0,easy?2:3);let ok1=0,rt=0;say('listen',T('يلا يا بطل، ركّز في المقطع زين، وبعدها أسألك عن كم شي.','يلا يا بطلة، ركّزي في المقطع زين، وبعدها أسألك عن كم شي.'));

el.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{est=+b.dataset.v;el.innerHTML=`<h2>توقعك ${est} ثانية</h2><p>اضغط ابدأ وعدّ من ١ إلى ١٠، وبعدها اضغط وقف.</p><button class="btn" id="tb">ابدأ</button>`;$('#tb').onclick=()=>{if(!s){s=Date.now();$('#tb').textContent='وقّف';say('think','أنا ساكت وأنت تعد...')}else{const a=(Date.now()-s)/1000,acc=Math.max(0,Math.round(100-Math.abs(est-a)/a*100));sfx('ok');say('happy',a>est?`أخذت ${a.toFixed(1)} ثانية، أكثر من توقعك شوي. عادي، الوقت يجري بسرعة.`:`أخذت ${a.toFixed(1)} ثانية، أقل من توقعك. حلو التقدير.`);setTimeout(()=>cb({acc,retries:0,data:{est,act:+a.toFixed(1)}}),2200)}}})}
function calmGame(el,it,cb){let c=0,go=1;G.stop=()=>{go=0;clearTimeout(G.t)};el.innerHTML=`<h2 id="bt">استعد...</h2><div class="br" id="br"></div><p class="note">٣ مرات، وتقدر تتوقف بأي وقت.</p>`;say('calm','على هونك. شهيق من الأنف وزفير من الفم.');
function b(){if(!go)return;$('#bt').textContent='شهيق...';$('#br').style.transform='scale(1.5)';G.t=setTimeout(()=>{$('#bt').textContent='زفير...';$('#br').style.transform='scale(1)';G.t=setTimeout(()=>{if(++c<3)b();else ask()},4000)},4000)}
function ask(){el.innerHTML=`<h2>كيف حسيت؟</h2><button class="opt" data-a="y">ارتحت</button><button class="opt" data-a="s">شوي</button><button class="opt" data-a="n">ما فرق</button><p class="note">إجابتك للمتابعة فقط.</p>`;el.querySelectorAll('[data-a]').forEach(x=>x.onclick=()=>{sfx('ok');cb({acc:null,retries:0,data:{help:x.dataset.a}})})}
G.t=setTimeout(b,800)}
function startGame(el,it,cb){let t0=0;G.stop=()=>clearInterval(G.iv);el.innerHTML=`<h2>وش المهمة اللي مأجلها؟</h2><input id="tk" placeholder="مثال: أرد على رسالة"><p>وش أصغر خطوة أولى؟ (دقيقتين بس)</p><input id="fs" placeholder="مثال: أفتح الرسالة"><br><br><button class="btn" id="go">ابدأ الدقيقتين</button>`;say('enc','نبدأ بخطوة صغيرة بس.');
$('#go').onclick=()=>{if(!$('#tk').value.trim()||!$('#fs').value.trim()){say('curious','اكتب المهمة والخطوة عشان نبدأ.');return}const fs=$('#fs').value;let left=120;el.innerHTML=`<h2>${fs}</h2><p style="font-size:44px;margin:0" id="cd">2:00</p><p class="note">أنا معك بهدوء.</p><button class="btn" id="dn" disabled style="opacity:.5">خلصت الدقيقتين</button>`;say('calm','');G.iv=setInterval(()=>{left--;const x=$('#cd');if(x)x.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');if(left<=0){clearInterval(G.iv);const d=$('#dn');if(d){d.disabled=0;d.style.opacity=1;say('happy','خلصت الدقيقتين! بدأت فعلاً.')}}},1000);$('#dn').onclick=()=>{if($('#dn').disabled)return;sfx('ok');cb({acc:null,retries:0,data:{task:$('#tk')?0:1}})}}}
// ===== progress / rewards / settings
function prog(){const H=S.hist.filter(h=>h.mid),C=H.filter(h=>h.status=='COMPLETED'),days=[...Array(7)].map((_,i)=>{const d=new Date(Date.now()-(6-i)*864e5);return{l:d.toLocaleDateString('ar-SA',{weekday:'short'}),n:C.filter(h=>h.d==d.toDateString()).length}}),mx=Math.max(1,...days.map(d=>d.n)),by={};C.forEach(h=>(by[h.id]=by[h.id]||[]).push(h));
if(!H.length)return `<h1>تطوري</h1><div class="card" style="text-align:center">${mas('curious',110)}<p>ما فيه بيانات لسا. أول ما تخلص تحدي يطلع تقدمك هنا.</p><button class="btn" onclick="go('home')">ابدأ مهمة اليوم</button></div>`;
const st=s=>H.filter(h=>h.status==s).length,ac=C.filter(h=>h.acc!=null),avg=ac.length?Math.round(ac.reduce((s,h)=>s+h.acc,0)/ac.length):'-';
return `<h1>تطوري</h1><div class="grid"><div class="card"><h3>مكتملة</h3><p style="font-size:34px;margin:0;color:var(--em)">${st('COMPLETED')}</p></div><div class="card"><h3>موقوفة / متخطاة</h3><p style="font-size:34px;margin:0">${st('ABANDONED')+st('SKIPPED')}</p></div><div class="card"><h3>متوسط الدقة</h3><p style="font-size:34px;margin:0;color:var(--lav)">${avg}${avg=='-'?'':'%'}</p></div><div class="card"><h3>مجموع النقاط</h3><p style="font-size:34px;margin:0;color:#c9971c">${S.xp}</p></div></div>
<div class="card"><h3>آخر ٧ أيام</h3><svg viewBox="0 0 280 110" width="100%">${days.map((d,i)=>`<rect x="${i*40+8}" y="${90-d.n/mx*70}" width="26" height="${Math.max(2,d.n/mx*70)}" rx="8" fill="#8DBFA3"/><text x="${i*40+21}" y="106" font-size="10" text-anchor="middle" fill="#263D37">${d.l}</text>`).join('')}</svg></div>
<div class="card"><h3>حسب التحدي</h3>${Object.entries(by).map(([k,a])=>{const x=a.filter(h=>h.acc!=null);return `<p>${CH[k].t}: ${a.length} مرة${x.length?`، آخر دقة ${x[x.length-1].acc}%`:''}، متوسط الوقت ${Math.round(a.reduce((s,h)=>s+h.dur,0)/a.length)} ث</p>`}).join('')}</div>
<div class="card"><h3>الطاقة اللي سجلتها</h3>${S.en.length?S.en.slice(-7).map(e=>`<span class="chip">${e.d.slice(4,10)} · ${{high:'عالية',mid:'عادي',low:'قليلة'}[e.e]}</span>`).join(''):'<p class="note">ما سجلت شي لسا.</p>'}</div>
<div class="card"><h3>ملاحظات</h3><p><b>معلوم:</b> أكملت ${C.length} من ${H.length} محاولات.</p>${H.length>=4?`<p><b>نمط ملحوظ:</b> ${C.filter(h=>h.dur<=60).length} من ${C.length} تحديات مكتملة أخذت دقيقة أو أقل.</p><p><b>فرضية تحتاج تأكيدك:</b> يمكن التحديات القصيرة تناسبك أكثر. أنت اللي تقرر.</p>`:'<p class="note">نحتاج ٤ محاولات على الأقل قبل ما نذكر نمط.</p>'}<p class="note">نتائج الألعاب للمتابعة الشخصية، وما تدل على تحسن علاجي أو تشخيص.</p></div>`}
function rew(){const H=S.hist.filter(h=>h.status=='COMPLETED'),ach=[['أول خطوة',H.length>=1],['خمس تحديات',H.length>=5],['المستوى ٢',lvl()>=2],['جربت ٣ ألعاب مختلفة',new Set(H.map(h=>h.id)).size>=3],['رجعت وحاولت مرة ثانية',H.some(h=>h.retries>0)],['رجعة حلوة بعد غياب',S.comeback&&H.length>0]],th=[['ثيم لافندر',3,'lilac'],['قبعة لخويّك',4,'']];
return `<h1>مكافآتي</h1><div class="card hero">${mas(lvl()>=3?'celebrate':'happy',110)}<div><h2 style="margin:0">المستوى ${lvl()}</h2><p>${S.xp} نقطة · باقي ${100-S.xp%100} للتالي</p></div></div><h2>إنجازات</h2><div>${ach.map(a=>`<span class="chip ${a[1]?'on':''}">${a[1]?'✓':'🔒'} ${a[0]}</span>`).join('')}</div><h2>مفتوحات</h2><div class="grid">${th.map(t=>`<div class="card"><h3>${t[0]}</h3><p class="note">${lvl()>=t[1]?'مفتوحة':'تنفتح عند المستوى '+t[1]}</p>${lvl()>=t[1]&&t[2]?`<button class="btn sm" onclick="S.theme=S.theme?'':'lilac';save();render()">${S.theme?'ألغِ':'فعّل'}</button>`:''}</div>`).join('')}</div><p class="note">بدون سلاسل أيام. أيام الراحة جزء طبيعي من الرحلة. المكافآت داخل التطبيق فقط حاليًا.</p>`}
function set(){return `<h1>ملفي</h1><div class="card"><h3>الاسم</h3><div class="row"><input id="sn" value="${S.name}" style="flex:1"><button class="btn sm" onclick="S.name=$('#sn').value||S.name;save();render()">حفظ</button></div><p>أخاطبك كـ ${[['m','ذكر'],['f','أنثى']].map(g=>`<button class="chip ${S.g==g[0]?'on':''}" onclick="S.g='${g[0]}';save();render()">${g[1]}</button>`).join('')}</p><p>حماية بعد الأذان: ${[0,20,30,45].map(v=>`<button class="chip ${S.pp==v?'on':''}" onclick="S.pp=${v};save();render()">${v}</button>`).join('')} دقيقة</p><p>الصوت <button class="chip ${S.snd?'on':''}" onclick="S.snd=S.snd?0:1;save();render()">${S.snd?'شغّال':'مقفل'}</button> أقل حركة <button class="chip ${S.rm?'on':''}" onclick="S.rm=S.rm?0:1;save();render()">${S.rm?'نعم':'لا'}</button></p></div><div class="card"><h3>بياناتك</h3><p class="note">كل شي محفوظ على جهازك فقط. تقدر تمسحه بالكامل.</p><button class="btn cor sm" onclick="if(confirm('تمسح كل بياناتك من هذا الجهاز؟')){localStorage.removeItem('kw2');location.reload()}">مسح بياناتي</button></div>`}
render();
</script></body></html>
