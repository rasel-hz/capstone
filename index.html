<!doctype html>
<html lang="ar-SA" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <!-- Sets the saved language before the first paint, so English never flashes in the wrong direction. -->
    <script>
      try {
        if (JSON.parse(localStorage.getItem('kw2') || 'null').lang === 'en') {
          document.documentElement.lang = 'en';
          document.documentElement.dir = 'ltr';
        }
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#28785B" />
    <meta name="description" content="زهو منصة سعودية للعافية الذهنية: تحديات تفاعلية وخطط يومية مرنة. ليست جهة تشخيص أو علاج." />
    <title>زهو | Zaho</title>
    <link rel="icon" type="image/png" href="/mascot/base/pose-main.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
